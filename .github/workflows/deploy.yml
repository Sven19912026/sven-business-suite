name: Deploy Business Suite 5.5

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: true

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm konfigurieren
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config set fetch-retries 2
          npm config set fetch-retry-mintimeout 1000
          npm config set fetch-retry-maxtimeout 10000
          node --version
          npm --version

      - name: Abhaengigkeiten installieren
        run: timeout 8m npm ci --no-audit --no-fund

      - name: Lint pruefen
        run: timeout 4m npm run lint

      - name: Anwendung bauen
        run: timeout 6m npm run build

      - name: Nach gh-pages veroeffentlichen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
